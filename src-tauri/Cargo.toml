[package]
name = "huanqu"
version = "0.1.0"
description = "唤取档案 —— 鸣潮唤取记录本地统计助手"
edition = "2021"

[lib]
name = "huanqu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "huanqu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
